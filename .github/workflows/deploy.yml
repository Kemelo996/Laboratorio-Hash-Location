name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["develop", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand --coverage=false

      - name: Build Angular
        run: npm run build -- --base-href /Laboratorio-Hash-Location/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/juegos/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify Live Deployment
        run: |
          URL="https://kemelo996.github.io/Laboratorio-Hash-Location/"
          echo "Verificando disponibilidad de $URL ..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Despliegue verificado exitosamente con HTTP 200."
              exit 0
            fi
            sleep 6
          done
          echo "Error: La aplicación no respondió con HTTP 200 tras múltiples reintentos."
          exit 1
